<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Étude climatique</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 Étude climatique</h1>
            <p class="subtitle">Tableaux mensuels multi-variables</p>
            <div class="mode-switch">
                <a href="/" class="mode-btn active">📍 Un lieu</a>
                <a href="/comparer" class="mode-btn">🔀 Comparer plusieurs lieux</a>
            </div>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, msg in messages %}
                <div class="flash {{ category }}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        <form action="/analyser" method="POST" class="card">
            <div class="onglets">
                <label class="onglet">
                    <input type="radio" name="mode" value="nom" checked
                           onclick="switchMode('nom')"> Nom du lieu
                </label>
                <label class="onglet">
                    <input type="radio" name="mode" value="coords"
                           onclick="switchMode('coords')"> Coordonnées GPS
                </label>
            </div>

            <div id="bloc-nom" class="bloc-mode">
                <label>Nom du lieu</label>
                <input type="text" name="nom_lieu" placeholder="Ex : Dakar, Sénégal">
            </div>

            <div id="bloc-coords" class="bloc-mode" style="display:none;">
                <div class="ligne-coords">
                    <div>
                        <label>Latitude</label>
                        <input type="number" step="0.0001" name="latitude" placeholder="14.74">
                    </div>
                    <div>
                        <label>Longitude</label>
                        <input type="number" step="0.0001" name="longitude" placeholder="-17.49">
                    </div>
                </div>
            </div>

            <div class="bloc-mode">
                <label>Nombre d'années</label>
                <input type="number" name="nb_annees" min="1" max="30" value="5">
            </div>

            <div class="bloc-mode">
                <label>Variables à analyser</label>
                <div class="grille-variables">
                    {% for cle, cfg in variables.items() %}
                    <label class="variable-item">
                        <input type="checkbox" name="variables" value="{{ cle }}"
                               {% if cle in ['temperature', 'pluie'] %}checked{% endif %}>
                        <span class="icone">{{ cfg.icone }}</span>
                        <span class="label">{{ cfg.label }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <button type="submit">Analyser</button>
        </form>
    </div>

    <script>
        function switchMode(mode) {
            document.getElementById('bloc-nom').style.display =
                (mode === 'nom') ? 'block' : 'none';
            document.getElementById('bloc-coords').style.display =
                (mode === 'coords') ? 'block' : 'none';
        }
    </script>
</body>
</html>
